# 吞噬星空（G 组，"沈瑞曦" sheet 序号 7813–8212）的比对口径（WO-102 §1）。
#
# 唯一口径来源：《吞噬星空视频对比说明_文字还原版.docx》（下称"指引"，节号照原文，例如"二（十一）"），
# 加上 DECISIONS D-056（默认口径）、D-057（以指引为准，同事填法不同处标黄；画面上云授权）。
# 指引附带的示例表（18 行）只作文风和判例参考；示例表和指引正文不一致的，按正文，下面逐条注明。
#
# by 表示这一列由谁定值：
#   webledger —— Codex 的网页台账（WO-101）；timeline —— 内容时间线（pilot/timeline，代码）；
#   model —— 分类模型（GLM，target-blind）；code —— 代码按规则推出；fixed —— 固定值。
# 同一列有多个来源时，按列出的顺序：前面的定了，后面的只能补充，不能推翻。

work:
  title: 吞噬星空
  characters: [罗峰, 徐欣, 洪, 雷神, 巴巴塔, 金角巨兽, 呼延博, 李耀, 维妮娜, 诺岚山, 混沌城主, 伯兰]   # 指引 一（一）1
  songs: [吞噬星空, 不朽的星空, 进阶]          # 指引 一（一）2：OP/ED/插曲（张杰、詹雯婷、林俊杰）
  official_logo:                                # WO-102 §2.3："吞噬星空官方台标出现在右下角，可以作为强线索"
    where: [0.70, 0.78, 0.30, 0.22]             # 播放器画面内的归一化区域 x, y, w, h（右下角）
    text: 吞噬星空
    min_match: 2                                # 本机 OCR 常把书法台标读成"吞噬呈空""吞獵呈空""容噬宝空"：3–5 字、以"空"结尾、逐位至少对上 2 字
  other_forms:                                  # 指引 一（二）：吞噬星空关联作品；T 列、错权都用这套名称
    漫画: 2D 静态彩漫
    动画剧场版: 《血洛大陆》《决战原始星》，右下角有片名水印
    手游: 2D 平面手绘的《吞噬星空》；3D 建模的《吞噬星空：黎明》，画面有 UI 按钮、血条、技能图标
    小说: 文字形式
    有声书: 朗读音频，画面多为封面或文字
  film_watermarks: [血洛大陆, 决战原始星]         # 指引 一（二）2：剧场版右下角水印，本机 OCR 可直接认
  references:                                   # 指引目录里的参考图（WO-102 §2.3），随拿不准的帧一起发给云端
    - {file: 血洛大陆.png, label: 动画剧场版《血洛大陆》}
    - {file: 决战原始星.png, label: 动画剧场版《决战原始星》}
    - {file: 吞噬星空游戏1.png, label: 手游《吞噬星空》（2D）}
    - {file: 吞噬星空游戏2.png, label: 手游《吞噬星空》（2D）}
    - {file: 吞噬星空3d游戏1.png, label: 手游《吞噬星空：黎明》（3D）}
    - {file: 吞噬星空3d游戏2.png, label: 手游《吞噬星空：黎明》（3D）}
  activity_reference: 活动.png                  # 指引 二（六）：标签区带小电视图标的话题标签

# 内容时间线的帧类别（WO-102 §2.2）。content 与 traffic 是两个维度：引流可以叠在正片上（示例 12429）。
timeline:
  step_seconds: 10
  content:
    tsxk: 吞噬星空动画（正片、官方 PV、官方海报或剧照，以及它们的录屏、截屏、翻拍）
    tsxk_other: 吞噬星空的其他形式（漫画、动画剧场版、手游、小说或有声书的文字画面）
    creator: UP 主自制画面（真人出镜、自制封面或片头、纯文字说明页、AI 生成的画面）
    unrelated: 其他 IP 或与吞噬星空无关的内容（其他影视、MV、其他游戏、无关图片）
    blank: 黑屏、加载中、没有画面
    unknown: 判不了（两家模型不一致，或都说不清）
  traffic:                                      # 指引 二（十一）："重点关注腾讯系（微信、QQ、腾讯微云）"
    tencent_words: [微信, 公众号, 企鹅群, QQ群, QQ, 扣扣, 微云, 腾讯文档, 加群, 群号, vx, VX, wx]
    tencent_domains: [weixin.qq.com, wx.qq.com, qm.qq.com, qun.qq.com, jq.qq.com, weiyun.com, docs.qq.com, u.wechat.com, work.weixin.qq.com, mp.weixin.qq.com]
    other_words: [网盘, 云盘, 百度网盘, 夸克, 阿里云盘, 迅雷, 天翼, 115网盘, 蓝奏, 123云盘, UC网盘, 移动云盘, 提取码, 资源已外泄, 扫码, 扫一扫, 完整版, 全集资源, 付费, 淘宝, 闲鱼, 电报群, TG群]
    other_domains: [pan.baidu.com, pan.quark.cn, quark.cn, aliyundrive.com, alipan.com, pan.xunlei.com, cloud.189.cn, 115.com, lanzou, 123pan.com, 123684.com, drive.uc.cn, caiyun.139.com, t.me]
    url_pattern: '(?:https?://|www\.)[\w./?=&%#:-]+|\b[\w-]+\.(?:com|cn|net|cc|top|xyz|me)\b[\w./?=&%-]*'
    group_pattern: '(?:群号?|裙号?|Q群|QQ|扣扣|企鹅|扣|抠)[:：\s]*\d{5,11}'
    # "裙""扣""抠"是 QQ 群号的常见躲避写法，例如"汁源抠裙645266305"（资源扣群，8455；D-065 ⑤-2）
    ignore_words: [bilibili, 哔哩哔哩, 弹幕, 发送, 投币, 收藏, 点赞]   # 播放器和页面自带文字，不算引流
    login_box_words: [扫描二维码登录, 扫码登录, 密码登录, 短信登录, 其他方式登录, 微信登录, QQ登录, 微博登录]
    # WO-102-R2 A2（D-063）：B 站自己弹出的登录框（有二维码和"微信登录、QQ 登录"）不是引流，也不是无关内容。
    # 画面里出现两种以上登录方式的字样，或一种字样加一个二维码，就按登录框处理；二维码指向 passport.bilibili.com 的也一样。
    undecoded_qr: cloud        # WO-102-R2 A3：读不出内容的二维码不直接算引流，交云端；两家都看到导流信息才算
  ai_note_pattern: 'AI\s*(虚构|生成|创作|制作|合成|绘制|演绎)|本视频由\s*AI|人工智能生成'
  # WO-102-R2 A4：画面文字里的"AI虚构""AI生成"等声明，按"利用 AI 创作"处理（二创，Z 参照"高"的示例③），标黄请人核实
  ai_note_top_fuzzy: '[无元]?不.{0,2}[导守][向肉购]'
  # 常见的"AI 虚构 无不良导向"标签贴在画面最上沿，常被播放器裁剪切去半截，OCR 读成"元不於守向""无不段守购"之类；
  # 只在画面顶部一条（上 20%）里按这个模糊式认"无不良导向"，不用于普通字幕
  content_span: 台账的 content_start–content_end（WO-101-R3）；区间外的帧（结束页、重播、报错页）不参与判断（WO-102-R2 A1）

# 口径开关（WO-102-R2 B，D-063 ⑤）：先按 Owner 的建议作默认值，所有者确认后可能再调。
policies:
  quote_captions:            # 问题 1：一段原片，只加了标题和零星的点评或引述字幕，没有连续讲解
    value: 单IP混剪
    options:
      单IP混剪: 归二创（单IP混剪类），U 填"否"；字幕或配音在连续讲解、分析剧情的，才归解说类（与同事一致）
      解说类: 按指引字面，以字幕形式评论剧情的也算解说类，U 填"是"
  w_scope:                   # 问题 2：W 的口径
    value: non_official
    options:
      non_official: 出现不属于吞噬星空官方动画素材的画面素材就填"是"（见 columns.W.rule）
      third_party: 只算与吞噬星空无关的第三方内容和引流（D-058 ④ 的旧口径）
  appended_unrelated:        # 问题 3：整集原片后面拼接了一段无关内容
    value: 偷渡
    options:
      偷渡: 按指引定义归偷渡，W 填"是"，AC 写明无关内容的时间段，标黄
      按主体: 按原片部分的性质归类（如纯cut），无关内容只在 W 和 AC 里写明
  film_only:                 # D-068：本案权利范围包括动画剧场版
    value: 按正片判
    options:
      按正片判: 只有剧场版画面的视频照正片按纯cut、偷渡、二创各子类判，Q 算有动画画面；T 不再区分；画面按正片处理（D-077）
      错权: 按指引字面，全部是剧场版这类其他形式的判错权
  z_knowledge:               # 问题 4：预告解析、结合设定或原著的讲解
    value: 高
    options:
      高: 属于知识解读，Z 填高；以剧情复述为主的解说仍填中
      中: 仍按解说的一般情况填中

columns:
  D:
    name: 视频标题（被告）
    values: 标题原文
    by: [webledger]
    rule: 播放页显示的标题与 C 列相同，照抄 C；不同的，填播放页的标题。
    source: 指引 二（一）
  F:
    name: 视频地址（被告）
    values: 地址 / 未显示
    by: [webledger]
    rule: 播放页地址与 E 列相同，照抄 E；不同的，填播放页地址；播放页没有显示地址的，填"未显示"。
    source: 指引 二（二）
  L:
    name: 取证完成时间（被告）
    values: yyyy/m/d hh:mm:ss
    by: [webledger]
    rule: 与 K 列和电子数据保全证书的"取证完成时间"比对；是一段时间的，取结束时间；不一致的以证书为准。
    format_example: 2026/8/12 10:46:06          # 指引的例子；D-056 定为 yyyy/m/d hh:mm:ss，不照同事"2026年4月1日…"的写法
    source: 指引 二（三）；D-056 ④
  Q:
    name: 视频内容完全不包含《吞》动画画面
    values: [是, 否]
    by: [timeline]
    rule: >-
      全片没有任何吞噬星空动画画面（包括官方 PV、官方海报或剧照，以及录屏、截屏、翻拍屏幕）的，填"是"；
      时间线里只要有 tsxk 帧，或有剧场版帧，就填"否"。
    note: 剧场版算动画画面：指引 二（十）W 列"否"的定义把剧场版列为《吞噬星空》动画素材；示例 16047（剧场版 PV）Q 填"否"。
    yellow: 没有 tsxk 帧、但有判不了的时间段时，填"是"并标黄
    red: 填"是"的行一律标红，交人判断（D-071）
    source: 指引 二（四）
  R:
    name: 是否完整播放
    values: [是, 否]
    by: [webledger]
    rule: 完整播完 B 站视频的全部内容（倍速不论）填"是"；有跳转、中途退出等没有完整呈现的，填"否"。
    yellow: 台账 complete_needs_review 为 true 的（靠外推且实测最高进度不到 90%，或页面何时结束拿不准），标黄（WO-102-R2 A1）
    colleague: 同事全部填"是"，以指引为准（D-057 ②），不一致的标黄
    source: 指引 二（五）
  S:
    name: 活动
    values: 具体活动名称 / 无
    by: [webledger]
    rule: 看标题、简介和下方标签区带小电视图标的"#"话题标签；有活动的填活动名称，没有的填"无"。
    not_visible: 录屏里看不到标签区的，填"无"，并在 AC【其他】写"录屏未显示标签区"（D-056 ④）
    note: 标题里的普通"#话题"不一定是活动（示例 16047 标题带"#青年创作者成长计划"，S 填"无"），以小电视图标为准。
    colleague: 同事全部填"无"，以指引为准，不一致的标黄
    source: 指引 二（六）；D-056 ④
  T:
    name: 是否涉及吞噬星空 IP 其他类型作品
    values: 是（漫画/手游/小说/有声书，可多项，用"、"连接）/ 否
    by: [timeline, model]
    rule: >-
      时间线里有其他形式的帧（漫画、手游），或者解说、字幕里结合了原著小说、有声书的内容，
      都算涉及；画面全是动画正片、但解说结合了小说的，也填"是（小说）"。涉及多种的，全部列出。
    note: 指引举例写的是"是（游戏、小说）"，填入内容写的是"手游"；本规则统一用"手游"。
    evidence: >-
      要有证据（WO-102-R2 A5）："是（小说）"要有小说文字画面，或者字幕、口播里明确提到原著或小说；
      动画画面按正片处理，不填写动画剧场版（D-077）。没有依据的填"否"。
    source: 指引 二（七）、一（二）；WO-102-R2 A5
  U:
    name: 是否为解说
    values: [是, 否]
    by: [model]
    rule: 必须有 UP 主自己的讲述或点评才填是；原片台词字幕、角色配音、自述、原片旁白和标题条都不算。看不出哪句是 UP 主自己的，归单IP混剪，U 否（D-077）。
    source: 指引 二（八）、二（十二）3.1
  V:
    name: 是否仅增加背景音乐
    values: [是, 否]
    by: [model]
    rule: >-
      在原片画面上只加了背景音乐、没有任何其他创作要素的，填"是"；除 BGM 外还有解说配音、文字说明、
      额外画面素材、特效处理等的，填"否"。纯 cut 没有"增加背景音乐"，也填"否"。
    ac: BGM 是 UP 主原创的，要在 AC 里写明
    watermark: UP 主水印不算"其他新增要素"（指引把水印归为规避识别的手段）；原片加背景音乐、只多了水印的，V 填"是"（WO-102-R2 A6）
    evidence: >-
      纯音乐时段不能单独证明是 UP 主加的配乐：原片的片头曲、片尾曲、打斗配乐都是纯音乐。能作旁证的只有：
      非吞噬星空画面上的配乐；屏幕上有台词字幕却听不到人声（原声被换掉）；非原片画面上的歌词字幕；B站音乐标签。
      只有"原片画面加纯音乐"的，填"否"并标黄，不填"是"。
    yellow: 只有原片画面加纯音乐时填"否"并标黄；没有声音分析结果时按画面判断并标黄
    source: 指引 二（九）；WO-102-R1 §1.5（D-060）
  W:
    name: 是否增加无关内容
    values: [是, 否]
    by: [timeline]
    rule: >-
      按 policies.w_scope 定。默认（WO-102-R2 B2，D-063 ⑤-2）：只要出现不属于吞噬星空官方动画素材的画面素材，
      就填"是"——AI 生成的画面、虚拟形象、真人出镜、UP 主自制的片头片尾页、截图、其他作品、吞噬星空的其他形式
      （漫画、手游、小说页）、引流画面；字幕、标题文字、水印、背景音乐不算。全部画面都来自官方动画素材
      （正片、剧场版、官方 PV、官方海报或剧照）的，填"否"。
    note: >-
      这条改掉了 D-058 ④ 原来"只算第三方内容"的窄口径；理由是指引对"否"的定义是全部素材都来自官方动画，
      示例表和同事也是这样填的。另一档 third_party 保留旧口径，所有者确认前不删。
    colleague: 同事 349 行填"是"，但 Y 列没有一行"偷渡"，以指引为准，不一致的标黄
    source: 指引 二（十）
  X:
    name: 是否含引流
    values: [是（腾讯）, 是（其他）, 是（腾讯、其他）, 否]
    by: [timeline, webledger]
    rule: >-
      播放页面（视频画面、评论区）有网盘链接、微信群或 QQ 群二维码、微信公众号、付费渠道等引流信息的，
      填"是"；腾讯系（微信、QQ、腾讯微云）填"是（腾讯）"，其他平台填"是（其他）"，两者都有填"是（腾讯、其他）"。
    ac: AC 里要写 ①引流出现的时间点，例如"01:27-01:37出现网盘链接"；②视频内容的时间段，例如"00:00-02:30主体为《吞噬星空》节选；02:31-11:47为无关内容"。时间由代码填。
    note: 评论区和简介里的引流由台账读（录屏滚动到那里才看得到）；看不到的，只按视频画面判断，并在 AC【其他】注明。
    colleague: 同事全部填"否"，以指引为准，不一致的标黄
    source: 指引 二（十一）
  Y:
    name: 类别
    values: [纯cut, 偷渡, 二创（解说类）, 二创（单IP混剪类）, 二创（多IP混剪类）, 二创（reaction类）, 二创（其他类）, 引流, 错权, 完全无关内容]
    by: [code, model]
    categories:                                 # 指引 二（十二）Y，按原文
      纯cut: 原片切条，从原片中截取相对完整的一段连续画面，未做任何处理
      偷渡: 一段原片内容或剧照，加一段与原片无关的内容；AC 记录无关内容的时间，例如"06:35-20:39为无关内容"
      二创（解说类）: 以配音或字幕形式对某段剧情、正片内容进行讲解、分析、评论（吞噬星空部分为解说、另拼接一段无关内容的，也属于这一类）
      二创（单IP混剪类）: 画面素材全部来自吞噬星空 IP；原片片段加音乐、转场、特效等，再接相隔较远的另一片段
      二创（多IP混剪类）: 画面素材不限于吞噬星空，还涉及其他 IP 作品，把多个 IP 的片段加转场、特效等编排组合
      二创（reaction类）: 画面里有原片内容，以及观看者本人即时的表情或语言反应
      二创（其他类）: 上面几类涵盖不了的剪辑二创，例如影评、盘点（人物战力排行）、多部作品对比
      引流: 标题、简介与吞噬星空相关，但视频里完全没有动漫内容，而是网盘链接、群二维码、公众号、付费渠道等引流信息
      错权: 画面、音乐等完全不是吞噬星空动漫，全部是吞噬星空 IP 的其他形式作品
      完全无关内容: 视频不含吞噬星空动画（只看视频内容，可以结合标题、简介、标签判断）
    code_first: >-
      先由代码按时间线定大类：没有 tsxk 帧时——只有其他形式（剧场版、漫画、手游）的判"错权"；
      主要是引流画面的判"引流"；其余判"完全无关内容"。有 tsxk 帧时，由模型在纯cut、偷渡和二创各子类中选。
    notes:
      - 视频主要是动画、只在部分片段出现引流的，不是引流类，在 X 列注明并写进 AC（指引 二（十二）4 注）。
      - 配音是小说内容、但画面含动漫原片的，不是错权，T 填"是（小说）"（指引 二（十二）5 注）。
      - reaction 类要在 AC 注明：原片加了透明度、遮挡物（马赛克、贴纸）、画面修改（滤镜、变形、缩放、裁切）；只含原片、不含观看者画面（指引 二（十二）3.4 注）。
      - 指引 3.1 例③（解说拼接无关内容）在示例表里标成"单IP混剪类"，按正文归解说类。
      - 无关内容需两家全轮认定且连续至少两帧，片头片尾单帧同样不算（D-077）。
    colleague: 同事的 Y 列没有一行"偷渡"，以指引为准，不一致的标黄
    source: 指引 二（十二）
  Z:
    name: 合理使用可能性
    values: [高, 中, 低, 不涉及]
    by: [code, model]
    header_note: 部分 sheet 的表头写"是否构成深度二创"，实际按合理使用可能性填高、中、低（D-056 ④）
    levels:                                     # 指引 二（十二）Z，按原文
      高: 含有独立于原片的全新表达，包括 UP 主自身的观点输出、知识解读、深度分析，或多个 IP 作品对比等
      中: 含有 UP 主自身的观点和解读，但相对原片的独立程度较低，例如以剧情复述为主的解说。单IP混剪一般填低（D-077）。
      低: 与原片只有细微差异，可能只加了换 BGM、贴纸、表情包之类的简单要素，主要为规避平台识别；纯cut；引流
    code_defaults: {纯cut: 低, 引流: 低, 偷渡: 低}   # 指引 Z"低"的示例②③；示例 12429（偷渡）填"低"
    ai: 画面有 AI 创作声明的，参照"高"的示例③（利用 AI 创作生成非原片画面），Z 填高并标黄（WO-102-R2 A4）
    high_only: >-
      Z 填"高"只限四种情况：知识解读（含预告解析、结合设定或原著的讲解）、深度分析、多作品对比、有声明的 AI 创作。
      以复述剧情为主的解说，即使插了几张非原片画面，仍填中（D-065 ⑤-4，例 8291）。
    ai_y: 以吞噬星空画面为基础的 AI 创作，Y 归二创（单IP混剪类），与示例表 13 号一致（D-065 ⑤-3，例 8406）
    # WO-102-R4 §2 的收紧（摘两句原话等）验证后两批的 Z 都变差，D-071 撤回，判法退回 R3。
    yellow: 所有"高"标黄；重答后依据仍不合格的"高"降为中并标黄（D-071，只加标记、不改判法）
    unsure: 完全无关内容、错权，指引没有给 Z 的标准；示例 11802（完全无关）填"高"，示例 16047（错权）填"低"。错权先按示例；完全无关内容填不涉及（D-077）。
    ac: 有疑虑的，在 AC 里写相应分析
    source: 指引 二（十二）Z
  AA:
    name: 对应第几集
    values: [无法判断]
    by: [fixed]
    rule: 一律填"无法判断"（所有者口径，D-056 ④）。
    note: >-
      指引本来按标题、简介公开标注的集数填（"第X集预告"填 X-1）；所有者改为一律"无法判断"。
      标题明确写了"第X集"的，由代码在 AC【其他】注明"标题标注第X集"。
    source: D-056 ④；指引 二（十三）
  AB:
    name: 播放页面其他（标签、简介等）与《吞》有关的情况
    values: 具体情况 / 无
    by: [webledger]
    rule: 除标题和画面外，看简介、标签、合集等位置有没有与吞噬星空相关的信息，写成"标签（吞噬星空、罗峰）、简介（吞噬星空）、合集（吞噬星空）"；都没有的填"无"。
    not_visible: 录屏里看不到简介区、标签区的，填"无"，并在 AC【其他】写"录屏未显示简介区"或"录屏未显示标签区"（D-056 ④）
    colleague: 同事全部填"无"，以指引为准，不一致的标黄
    source: 指引 二（十四）；D-056 ④
  AC:
    name: 视频说明
    sections: [【主题概括】, 【段落情节】, 【新增创作要素情况】, 【比对意见】, 【其他】]
    by: [model, code]
    rule: >-
      【主题概括】1–2 句概括核心主题和创作目的；【段落情节】写涉及的动漫主要情节；【新增创作要素情况】
      列出 UP 主新增的创作内容（虚拟人物、AI 创作、背景音乐、配音、字幕、真人出镜、转场特效、画面遮挡、
      表情包等）；【比对意见】结合前面各列和视频内容，给出是否构成合理使用的初步评估；【其他】记录前面
      没有涵盖、但可能影响侵权认定的特殊情况。每段 1–3 句（WO-102 §3）。
    code_fills: >-
      时间段和引流时间点由代码写进【其他】（X、偷渡、W 的时间段；标签区、简介区未显示；标题标注的集数），
      模型不写任何数字。
    style: 不直接引用视频原话（D-049）；新增创作要素、其他两段按"1.…"分条
    clock: >-
      时间写取证录屏上的时间，与指引示例一致：示例 12429 的"02:31-11:47"止于录屏总长 11:47（该 P 本身 10:50），
      示例 8799 的"2:41-3:05"超出了按视频时间能播到的位置。视频本身的时间留在 timeline.json 里备查。
    source: 指引 二（十五）；WO-102 §3
