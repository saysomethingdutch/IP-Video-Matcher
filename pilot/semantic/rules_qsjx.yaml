# 《七时吉祥》客户口径规则（WO-004b §3.4）。唯一依据：《七时吉祥比对要求.docx》（pandoc -t plain 转写）。
# 每条规则后的注释给出原文出处（"要求 L行号" 指转写文本的行号）。换案时替换本文件。
#
# 四格顺序：合理使用可能性 / 演绎可能性 / 合理使用类型 / 演绎类型（比对表 AG / AH / AI / AJ）。
# "/" 表示不填：要求 L98 "合理使用类型……如不构成合理使用，则/"。

natures:
  剧情解说:
    grid: [否, 是, /, 剧情解说]
    # 要求 L104："b) 剧情解说类最后四格填写为：'否 是 / 剧情解说'"
    # 要求 L100："剧情类解说体现为纯讲解剧情，几乎没有个人观点和评论，我们比对时认为不构成合理使用……但是是演绎的一种"
  夹叙夹议解说:
    grid: [是, 是, 夹叙夹议类解说, 夹叙夹议解说]
    # 要求 L102："a) 夹叙夹议类解说最后四格填写为：'是 是 夹叙夹议类解说 夹叙夹议解说'"
    # 要求 L100："夹叙夹议类解说体现为对剧情的叙述与个人观点及评议约各占一半，我们比对时认为仍构成合理使用，且是合理使用的最低门槛"
  观点评析:
    grid: [是, 是, "观点评析（{subtype}）", 观点评析类解说]
    # 要求 L106-108："c) 观点评析类解说最后四格需填写二级分类，如：'是 是 观点评析（恶搞讽刺） 观点评析类解说'"
    subtypes: [深度解读, 拉片解读, 细节分析, 人物小传, 服化道盘点, 文化科普, 恶搞讽刺]
    # 要求 L92："观点评析（具体有：深度解读、拉片解读、细节分析类、人物小传类、服化道盘点、文化科普类、恶搞讽刺等）"
  reaction:
    grid: [是, 是, Reaction类, Reaction类]
    # 要求 L112："如果遇到Reaction类和混剪类，分类时直接写成'Reaction类''混剪类'。本次比对以Reaction类视频为主，请大家尽量论证构成合理使用"
  混剪:
    grid: [是, 是, 混剪类, 混剪类]
    subtypes: [人物向, CP向, 恶搞向]
    # 要求 L92："混剪（人物向、CP向、恶搞向）"；L112："分类时直接写成……'混剪类'……如遇针对混剪类视频，视视频内容的转换性程度比对即可"
    low_recreation: 不确定
    # 再创作很少（没有明显的情感主题、字幕、配乐、剪辑）：不自动判定，标黄（WO-004b §3.4 表）
  原片搬运:
    grid: [否, 否, /, /]
    confirm: 待所有者确认
    # 本案要求无原文。依据《爱情公寓5》表中的备注"纯切条类…合理使用可能性、演绎可能性填否"（WO-004b §3.4 表）
  其他:
    grid: null
  不确定:
    grid: null

jump:
  prefix: "跳播+"
  # 要求 L114："如果遇到跳播且能分辨类型的，则填写最后两格'跳播+观点评析（恶搞讽刺）'或'跳播+混剪类'"
  intentional: 疑似故意跳播
  # 要求 L116-126："Reaction类还有一种情形属于'故意跳播'"，判断依据 A(a)-(d)；WO-004b：永远不自动判定，只出候选、标红

title_novel:
  words: [原著, 小说]
  # 要求 L134："内容包含【原著】【小说】的情况，需要注意……'是否含有非权利作品'？是的，因为配音部分为小说"

commentary:
  # 解说类的分界由代码按 UP 主文字的逐句标签决定，不交给模型（WO-004b §3.3）。
  # 团队口径，2026-09-26（D-041，WO-004b-R2 §1.4）：纯剧情解说不算合理使用；夹叙夹议算，即 UP 主除复述剧情外
  # 还有一些自己的观点。门槛比《比对要求》L100 字面的"约各占一半"低，以团队口径为准。
  plot_max_comments: 2        # 观点句 ≤ 2，且观点占比 < plot_max_share → 剧情解说（四格"否/是"）
  plot_max_share: 0.15
  mixed_min_comments: 3       # 观点句 ≥ 3，且观点占比 ≥ mixed_min_share → 夹叙夹议（"是/是"）
  mixed_min_share: 0.15
  mixed_confident_share: 0.5  # 夹叙夹议但占比 < 0.5：标黄"观点偏少，按团队口径判夹叙夹议"
  opinion_min_share: 0.5      # 模型判观点评析、且占比 ≥ 0.5：照旧判观点评析
  min_tagged: 5               # 可判断的句子少于 5 句：不确定（WO-004b 原有的保护）
  # 其余 → 不确定，标黄，交所有者
