[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ip-video-matcher"
version = "0.2.0"
description = "Copyright comparison tables for video evidence: machine drafts, lawyer review"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "numpy>=2.0,<3",
  "Pillow>=11,<13",
  "PyYAML>=6,<7",
  "openpyxl>=3.1,<4",
  "lxml>=5,<7",
  "scipy>=1.12,<2",
  "opencv-python>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]
# 易存云下载和证书读取（pilot/ezcun、pilot/webledger/certificates.py）
fetch = ["playwright>=1.60", "PyMuPDF>=1.24"]
# 声音转写装在单独的环境里：workspace/pilot/audio_env（见 pilot/README.md）

[tool.setuptools.packages.find]
where = ["."]
include = ["pilot*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests", "pilot"]
