[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ip-video-matcher"
version = "0.1.0"
description = "Local-first, auditable video timeline matcher for IP lawyers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "click>=8.1,<9",
  "numpy>=2.0,<3",
  "Pillow>=11,<13",
  "PyYAML>=6,<7",
  "openpyxl>=3.1,<4",
  "lxml>=5,<7",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8"]

[project.scripts]
ipvm = "ipvm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
